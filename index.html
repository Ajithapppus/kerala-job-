      const [resumeAnalyzing, setResumeAnalyzing] = useState(false);
      const [analyzedScoreResult, setAnalyzedScoreResult] = useState(null);
      const [analyzingProgress, setAnalyzingProgress] = useState(0);

      // --- NOTIFICATION HANDLER ---
      const addNotification = (title, message) => {
        setNotifications(prev => [
          { id: Date.now(), title, message, time: "Just now", unread: true },
          ...prev

      // --- RESUME SCORE SIMULATOR FUNCTION ---
      const analyzeResume = (fileName, jobSkills = []) => {
        setResumeAnalyzing(true);
        setAnalyzingProgress(10);
        
        let interval = setInterval(() => {
          setAnalyzingProgress(prev => {
            if (prev >= 100) {
              clearInterval(interval);
              setTimeout(() => {
                // Score based on skills match
                const candidateSkills = user.skills;
                const matched = jobSkills.length > 0 
                  ? jobSkills.filter(s => candidateSkills.some(cs => cs.toLowerCase() === s.toLowerCase()))
                  : candidateSkills;
                
                const percentage = jobSkills.length > 0 
                  ? Math.round(50 + (matched.length / jobSkills.length) * 45)
                  : Math.round(60 + Math.random() * 30);
                
                const result = {
                  score: Math.min(percentage, 100),
                  matched: matched.length > 0 ? matched : ["JavaScript", "HTML/CSS"],
                  missing: jobSkills.filter(s => !candidateSkills.some(cs => cs.toLowerCase() === s.toLowerCase())),
                  readability: percentage > 80 ? "Excellent" : "Good",
                  tips: [
                    "Highlight cloud deployments (AWS/Docker) under your internship description.",
                    "Include a dedicated Git/GitHub link detailing repository structure.",
                    "Quantify accomplishments, e.g., 'reduced API fetch latency by 20%'"
                  ]
                };

                setUser(prev => ({ ...prev, resumeFile: fileName, resumeScore: result.score }));
                setAnalyzedScoreResult(result);
                setResumeAnalyzing(false);
                addNotification("Resume Scan Completed", `AI compatibility score generated: ${result.score}% for target role.`);
              }, 400);
              return 100;
            }
            return prev + 15;
          });
        }, 150);
      };

      // --- BOT CONVERSATION ENGINE (Kerala focused) ---
      const handleSendBotMessage = () => {
        if (!userBotMsg.trim()) return;
        const text = userBotMsg;
        setChatMessages(prev => [...prev, { sender: "user", text }]);
        setUserBotMsg("");
        setIsTyping(true);

        setTimeout(() => {
          let botReply = "I'm here to assist! Could you specify if you are looking for jobs in Kochi Infopark or Thiruvananthapuram Technopark?";
          const lText = text.toLowerCase();
          
          if (lText.includes("technopark") || lText.includes("trivandrum")) {
            botReply = "Technopark Trivandrum hosts massive companies like Infosys, UST, and Tata Elxsi. Currently, we have positions in Embedded IoT at Tata Elxsi, Spring Boot at Infosys, and 3D Animation at Toonz Animation!";
          } else if (lText.includes("infopark") || lText.includes("kochi")) {
            botReply = "Infopark Kochi is bustling with product startups and MNCs. You'll find listings for Senior Full-Stack Engineer at UST Kochi, and Frontend UI roles at CareStack (KSUM incubated)!";
          } else if (lText.includes("resume") || lText.includes("score")) {

                  </div>
                  <div class="p-5 bg-gradient-to-br from-kerala-gold/10 to-transparent dark:from-kerala-gold/5 rounded-2xl border border-kerala-gold/20 space-y-2">
                    <h4 class="font-extrabold text-base text-kerala-gold">Decentralized Incubation</h4>
                    <p class="text-slate-500 dark:text-slate-400">Enabling startup incubation boards to advertise directly to candidates, offering fast track equity ownership stakes alongside competitive benefits.</p>
                  </div>
                </div>
              </div>
            )}

            {/* 7. CONTACT VIEW */}
            {activePage === "contact" && (
              <div class="max-w-4xl mx-auto px-4 py-12 space-y-10">
                <div class="text-center space-y-3">
                  <h1 class="text-4xl font-extrabold text-slate-900 dark:text-white font-outfit">Reach Our Headquarters</h1>
                  <p class="text-xs text-slate-400">Drop us a line and our partner coordinators will respond shortly.</p>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                  {/* Left: Contact Form */}
                  <div class="glass-card rounded-2xl p-6 border border-slate-200 dark:border-slate-800 shadow space-y-4">
                    <h3 class="font-extrabold text-lg font-outfit">Send a Message</h3>
                    
                    <form onSubmit={(e) => { e.preventDefault(); addNotification("Inquiry Sent Successfully", "Thanks for reaching out. We will contact you soon."); e.target.reset(); }} class="space-y-4 text-xs">
                      <div>
                        <label class="block font-bold text-slate-400 mb-1">Your Full Name</label>
                        <input type="text" required placeholder="Madhavan Pillai" class="w-full bg-slate-50 dark:bg-slate-900 border px-3 py-2 rounded-lg text-slate-900 dark:text-white focus:outline-none" />
                      </div>
                      <div>
                        <label class="block font-bold text-slate-400 mb-1">Email Address</label>
                        <input type="email" required placeholder="madhavan@gmail.com" class="w-full bg-slate-50 dark:bg-slate-900 border px-3 py-2 rounded-lg text-slate-900 dark:text-white focus:outline-none" />
                      </div>
                      <div>
                        <label class="block font-bold text-slate-400 mb-1">Detailed Message</label>
                        <textarea required rows="4" placeholder="How can we assist you today?..." class="w-full bg-slate-50 dark:bg-slate-900 border px-3 py-2 rounded-lg text-slate-900 dark:text-white focus:outline-none"></textarea>
                      </div>

                      <button type="submit" class="w-full py-3 bg-gradient-to-r from-kerala-green to-emerald-600 text-white font-bold rounded-xl hover:opacity-90 active:scale-95 shadow transition-all font-outfit">Deliver Inquiry</button>
                    </form>
                  </div>

                  {/* Right: Hub Coordinates */}
                  <div class="space-y-6 text-sm text-slate-600 dark:text-slate-400">
                    <div class="glass-card rounded-2xl p-5 border border-slate-200 dark:border-slate-800 shadow space-y-3">
                      <h4 class="font-bold text-slate-900 dark:text-white flex items-center gap-1.5"><i class="text-kerala-green">📍</i> Kochi Infopark Office</h4>
                      <p class="text-xs">Third Floor, KSUM Incubation Building, Infopark Phase-1 Campus, Kakkanad, Ernakulam, Kerala - 682030</p>
                    </div>
                    <div class="glass-card rounded-2xl p-5 border border-slate-200 dark:border-slate-800 shadow space-y-3">
                      <h4 class="font-bold text-slate-900 dark:text-white flex items-center gap-1.5"><i class="text-kerala-gold">📍</i> Trivandrum Technopark Center</h4>
                      <p class="text-xs">Ground Floor, Thejaswini Building, Technopark Campus Phase-1, Kazhakkoottam, Thiruvananthapuram, Kerala - 695581</p>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* 8. AUTHENTICATION PAGE */}
            {activePage === "auth" && (
              <div class="max-w-md mx-auto px-4 py-16">
                <div class="glass-card rounded-3xl p-6 md:p-8 border border-slate-200 dark:border-slate-800 shadow-2xl space-y-6">
                  
                  <div class="text-center space-y-2 border-b pb-4">
                    <h2 class="text-2xl font-extrabold font-outfit">Join KeralaHire Portal</h2>
                    <p class="text-xs text-slate-400">Switch account type to configure custom dashboard roles.</p>
                  </div>

                  <div class="space-y-4">
                    {/* Role Selection */}
                    <div>
                      <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-1.5">Configure Role type</label>
                      <div class="flex gap-2">
                        {["candidate", "recruiter"].map(r => (
                          <button
                            key={r}
                            onClick={() => setUser(prev => ({ ...prev, role: r }))}
                            class={`flex-grow py-2 rounded-xl text-xs font-bold border transition-all capitalize ${
                              user.role === r 
                                ? 'bg-kerala-green text-white border-kerala-green' 
                                : 'bg-transparent border-slate-200 dark:border-slate-800 hover:bg-slate-100 dark:hover:bg-slate-900'
                            }`}
                          >
                            {r}
                          </button>
                        ))}
                      </div>
                    </div>

                    {/* Email Input & Password */}
                    <div class="space-y-3 text-xs">
                      <div>
                        <label class="block font-bold text-slate-400 mb-1">Email ID</label>
                        <input type="email" placeholder="enter email..." class="w-full bg-slate-50 dark:bg-slate-900 border px-3 py-2 rounded-lg text-slate-900 dark:text-white focus:outline-none" />
                      </div>
                      <div>
                        <label class="block font-bold text-slate-400 mb-1">Password</label>
                        <input type="password" placeholder="enter security key..." class="w-full bg-slate-50 dark:bg-slate-900 border px-3 py-2 rounded-lg text-slate-900 dark:text-white focus:outline-none" />
                      </div>
                    </div>

                    <button 
                      onClick={() => {
                        setUser(prev => ({ ...prev, isLoggedIn: true }));
                        addNotification("Access Granted", `Welcome back! Navigated to ${user.role} workspace.`);
                        setActivePage("dashboard");
                      }}
                      class="w-full py-3.5 bg-gradient-to-r from-kerala-green to-emerald-600 text-white font-extrabold text-sm rounded-xl transition-all shadow shadow-premium font-outfit"
                    >
                      Authenticate Credentials
                    </button>

                    <div class="border-t border-slate-200 dark:border-slate-800 pt-4 space-y-2">
                      <button 
                        onClick={() => {
                          setUser(prev => ({ ...prev, isLoggedIn: true }));
                          addNotification("Google Sign-In Successful", "Auth tokens configured via Google Secure Sandbox.");
                          setActivePage("dashboard");
                        }}
                        class="w-full py-2.5 border hover:bg-slate-50 dark:hover:bg-slate-900 rounded-xl text-xs font-bold transition-all flex items-center justify-center gap-2"
                      >
                        <span>🔴</span> Continue with Google
                      </button>
                    </div>

                  </div>
                </div>
              </div>
            )}

          </main>

          {/* --- FLOATING CHATBOT SUPPORT PANEL ("KeraBot") --- */}
          <div class="fixed bottom-6 right-6 z-50">
            
            {/* Chatbot Bubble Button */}
            {!chatBotOpen && (
              <button 
                onClick={() => setChatBotOpen(true)}
                class="w-14 h-14 rounded-full bg-gradient-to-tr from-kerala-green to-emerald-500 text-white flex items-center justify-center shadow-2xl hover:scale-105 active:scale-95 transition-all animate-float relative cursor-pointer"
                title="Live Chat Support"
              >
                <i data-lucide="message-square" class="w-6 h-6"></i>
                <span class="absolute -top-1.5 -right-1.5 bg-kerala-gold text-slate-950 font-extrabold text-[8px] px-2 py-0.5 rounded-full border border-white dark:border-slate-950 uppercase tracking-widest shadow">Live</span>
              </button>
            )}

            {/* Chat Window Container */}
            {chatBotOpen && (
              <div class="w-80 h-96 glass-modal rounded-3xl shadow-2xl border border-slate-200 dark:border-slate-800 flex flex-col justify-between overflow-hidden">
                
                {/* Header bar */}
                <div class="bg-gradient-to-r from-kerala-green to-emerald-600 text-white p-3.5 flex justify-between items-center">
                  <div class="flex items-center gap-2">
                    <span class="w-8 h-8 rounded-xl bg-white/20 flex items-center justify-center font-bold text-xs">🌴</span>
                    <div>
                      <h4 class="font-extrabold text-xs font-outfit">KeraBot Platform Guide</h4>
                      <span class="text-[9px] opacity-75">Replies instantly &bull; online</span>
                    </div>
                  </div>
                  <button onClick={() => setChatBotOpen(false)} class="text-white hover:opacity-75"><i data-lucide="x" class="w-4 h-4"></i></button>
                </div>

                {/* Messages log */}
                <div class="flex-grow p-3 space-y-3 overflow-y-auto text-xs bg-slate-50/50 dark:bg-slate-900/10">
                  {chatMessages.map((msg, i) => (
                    <div key={i} class={`flex flex-col ${msg.sender === 'user' ? 'items-end' : 'items-start'}`}>
                      <div class={`p-2.5 rounded-2xl max-w-[85%] leading-relaxed ${
                        msg.sender === 'user' 
                          ? 'bg-kerala-green text-white rounded-tr-none shadow' 
                          : 'bg-white dark:bg-slate-900 border text-slate-800 dark:text-slate-200 rounded-tl-none shadow-sm'
                      }`}>
                        {msg.text}
                      </div>
                    </div>
                  ))}
                  {isTyping && <div class="text-[10px] text-slate-400 italic">KeraBot is typing response...</div>}
                </div>

                {/* Input form */}
                <div class="border-t border-slate-200 dark:border-slate-800 p-2 bg-white dark:bg-slate-950 flex gap-1">
                  <input 
                    type="text" 
                    placeholder="Ask about Technopark, CV analysis..." 
                    value={userBotMsg}
                    onChange={(e) => setUserBotMsg(e.target.value)}
                    onKeyDown={(e) => e.key === 'Enter' && handleSendBotMessage()}
                    class="w-full bg-slate-50 dark:bg-slate-900 text-xs px-3 py-2 rounded-xl text-slate-900 dark:text-white focus:outline-none" 
                  />
                  <button 
                    onClick={handleSendBotMessage}
                    class="p-2 bg-kerala-green text-white rounded-xl hover:opacity-90 shadow"
                  >
                    ➔
                  </button>
                </div>

              </div>
            )}

          </div>

          {/* --- FOOTER --- */}
          <footer class="bg-slate-900 dark:bg-slate-980 text-slate-400 py-12 border-t border-slate-800">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 grid grid-cols-1 md:grid-cols-4 gap-8">
              
              <div class="space-y-4">
                <div class="flex items-center">
                  <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-kerala-green to-emerald-400 flex items-center justify-center text-white text-base font-bold shadow-premium mr-2.5">KH</div>
                  <span class="text-lg font-bold text-white font-outfit">Kerala<span class="text-kerala-gold">Hire</span></span>
                </div>
                <p class="text-xs leading-relaxed text-slate-500">
                  Decentralizing career development across Ernakulam, Thiruvananthapuram, Thrissur, and Cyberpark Kozhikode hubs.
                </p>
                <div class="text-slate-600 text-[10px]">
                  &copy; 2026 KeralaHire Platform. Incubated in Kerala Startup Mission. All rights reserved.
                </div>
              </div>

              <div>
                <h4 class="font-bold text-xs uppercase text-slate-300 tracking-wider mb-4">For Candidates</h4>
                <ul class="space-y-2 text-xs">
                  <li><button onClick={() => { setActivePage("jobs"); setSelectedJobId(null); }} class="hover:text-white transition-colors">Search Tech Jobs</button></li>
                  <li><button onClick={() => setActivePage("dashboard")} class="hover:text-white transition-colors">AI Resume score</button></li>
                  <li><button onClick={() => setActivePage("dashboard")} class="hover:text-white transition-colors">Personalized Recommendations</button></li>
                  <li><button onClick={() => setActivePage("about")} class="hover:text-white transition-colors">Technopark Shuttle Maps</button></li>
                </ul>
              </div>

              <div>
                <h4 class="font-bold text-xs uppercase text-slate-300 tracking-wider mb-4">For Employers</h4>
                <ul class="space-y-2 text-xs">
                  <li><button onClick={() => { setUser(prev => ({ ...prev, role: 'recruiter' })); setActivePage("dashboard"); }} class="hover:text-white transition-colors">Advertise Openings</button></li>
                  <li><button onClick={() => { setUser(prev => ({ ...prev, role: 'recruiter' })); setActivePage("dashboard"); }} class="hover:text-white transition-colors">Candidate Shortlisting</button></li>
                  <li><button onClick={() => setActivePage("about")} class="hover:text-white transition-colors">KSUM Badging verifications</button></li>
                  <li><button onClick={() => setActivePage("contact")} class="hover:text-white transition-colors">Employer API Pricing</button></li>
                </ul>
              </div>

              <div>
                <h4 class="font-bold text-xs uppercase text-slate-300 tracking-wider mb-4">Legal & Support</h4>
                <ul class="space-y-2 text-xs">
                  <li><button onClick={() => setActivePage("contact")} class="hover:text-white transition-colors">Submit Support Ticket</button></li>
                  <li><button onClick={() => setActivePage("about")} class="hover:text-white transition-colors">Privacy Regulations</button></li>
                  <li><button onClick={() => setActivePage("about")} class="hover:text-white transition-colors">Terms of Operations</button></li>
                </ul>
              </div>

            </div>
          </footer>

        </div>
      );
    }

    // Mount App
    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);

    // Load Lucide Icons after React components render
    setTimeout(() => {
      if (window.lucide) {
        window.lucide.createIcons();
      }
    }, 500);
  </script>
</body>
</html>
